# VOICEBANK ANALYTICS — Blueprint Render
# Les secrets (sync: false) se renseignent dans le tableau de bord Render.
# Render → New → Blueprint → choisir ce dépôt. Voir README, section « Mettre en ligne ».

services:
  - type: web
    name: voicebank-api
    runtime: docker
    plan: free                         # sans cette ligne, Render propose une offre payante
    dockerfilePath: ./voicebank_api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/vivant      # sonde sans base de données (la base peut dormir : Neon)
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL              # base Neon (gratuite, sans expiration) : voir README, « Base sans expiration »
        sync: false
      - key: READONLY_DATABASE_URL     # URL du compte voicebank_reader (voir README)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VOICEBANK_USERS
        sync: false
      - key: ALLOWED_ORIGINS           # ex. https://voicebank-ui.onrender.com
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHISPER_LOCAL              # offre gratuite (512 Mo) : transcription via Groq uniquement
        value: "false"
      - key: URL_INTERFACE              # retour après paiement (adresse de l'interface)
        value: https://voicebank-ui.onrender.com
      - key: TACHES_CLE                 # tâches automatiques : même valeur que le secret TACHES_CLE de GitHub
        generateValue: true
      - key: TURNSTILE_SECRET           # anti-robot (Cloudflare Turnstile) : clé secrète
        sync: false
      - key: SENTRY_DSN                 # alertes d'erreurs de l'API (sentry.io, gratuit ; voir README)
        sync: false
      - key: GOOGLE_CLIENT_ID           # connexion Google Workspace (facultatif, voir README)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID        # connexion Microsoft 365 / Entra ID (facultatif, voir README)
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: NOTCHPAY_PUBLIC_KEY        # paiement : business.notchpay.co → Settings → API Keys
        sync: false
      - key: NOTCHPAY_HASH_KEY          # signature des webhooks (même page)
        sync: false
      - key: BREVO_API_KEY              # e-mails « mot de passe oublié » (brevo.com → SMTP & API → Clés API)
        sync: false
      - key: EMAIL_EXPEDITEUR           # adresse validée dans Brevo (Expéditeurs)
        sync: false
      - key: CLE_SOURCES                # chiffre les identifiants des bases connectées
        generateValue: true
      - key: INITIALISER_BASE           # crée le schéma au démarrage (idempotent)
        value: "true"
      - key: DONNEES_DEMO               # remplit une base VIDE avec des données fictives
        value: "true"

  - type: web
    name: voicebank-ui
    runtime: static                    # sites statiques : gratuits
    rootDir: voicebank-ui
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Si l'API change d'adresse (domaine personnalisé), mets-la aussi dans connect-src.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://voicebank-api.onrender.com https://challenges.cloudflare.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io; frame-src https://challenges.cloudflare.com; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    envVars:
      - key: REACT_APP_API_URL         # ex. https://voicebank-api.onrender.com
        sync: false
      - key: REACT_APP_POWER_BI_URL
        sync: false
      - key: REACT_APP_SENTRY_DSN       # alertes d'erreurs de l'interface (projet Sentry « navigateur »)
        sync: false
      - key: REACT_APP_TURNSTILE_SITE_KEY   # anti-robot (Cloudflare Turnstile) : clé de site, publique
        sync: false

# La base gratuite de Render expire au bout de 30 jours : la base de données est chez Neon (gratuite, sans expiration).
# Retirer la base de ce fichier ne la supprime pas chez Render (« Changes to a Blueprint never cause a resource to be
# deleted ») : supprime-la toi-même une fois les données copiées (sauvegarde/passer_a_neon).
