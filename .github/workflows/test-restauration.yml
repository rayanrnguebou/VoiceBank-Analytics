# Test de restauration mensuel : une sauvegarde qu'on n'a jamais restaurée n'est pas une sauvegarde.
# Le 1er de chaque mois, la dernière sauvegarde de la nuit (workflow « Sauvegarde en ligne ») est déchiffrée et
# restaurée dans une base PostgreSQL vide et jetable, puis contrôlée : mêmes tables que la base en ligne, tables
# essentielles non vides, nombre de lignes cohérent, sauvegarde de moins de 2 jours. Résultat par e-mail (réussite ou
# échec) si les secrets d'alerte existent. Rien n'est écrit dans la base en ligne : elle est seulement lue.
# Secrets : les mêmes que la sauvegarde (BASE_EN_LIGNE_URL, SAUVEGARDE_MOT_DE_PASSE) et l'alerte par e-mail
# (BREVO_API_KEY, ALERTE_EMAIL, EMAIL_EXPEDITEUR).
name: Test de restauration

on:
  schedule:
    - cron: "41 3 1 * *"        # le 1er du mois à 03:41 UTC, après la sauvegarde de la nuit
  workflow_dispatch:

permissions:
  contents: read
  actions: read                  # télécharger la sauvegarde produite par l'autre workflow

jobs:
  restauration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      essai:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: essai
          POSTGRES_DB: restauration
        ports: ["5439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Vérifier la configuration
        id: config
        env:
          URL: ${{ secrets.BASE_EN_LIGNE_URL || secrets.RENDER_DATABASE_URL }}
          MDP: ${{ secrets.SAUVEGARDE_MOT_DE_PASSE }}
        run: |
          if [ -z "$URL" ] || [ -z "$MDP" ]; then
            echo "Secrets BASE_EN_LIGNE_URL / SAUVEGARDE_MOT_DE_PASSE absents : test ignoré."
            echo "actif=false" >> "$GITHUB_OUTPUT"
          else
            echo "actif=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Télécharger la dernière sauvegarde
        if: steps.config.outputs.actif == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Échec de la commande : $BASH_COMMAND (ligne $LINENO)"' ERR
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow sauvegarde-en-ligne.yml --status success --limit 1 \
                --json databaseId,createdAt --jq '.[0].databaseId // empty')
          [ -n "$RUN" ] || { echo "::error::Aucune sauvegarde réussie trouvée"; exit 1; }
          AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$(gh run view "$RUN" -R "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)" +%s) ) / 3600 ))
          echo "Sauvegarde du run $RUN, il y a $AGE_H h"
          [ "$AGE_H" -le 48 ] || { echo "::error::Dernière sauvegarde trop ancienne ($AGE_H h) : la sauvegarde de la nuit ne tourne plus"; exit 1; }
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -D sauvegarde
          FICHIER=$(find sauvegarde -name '*.dump.enc' | head -1)
          [ -n "$FICHIER" ] || { echo "::error::Fichier de sauvegarde introuvable dans l'artefact"; exit 1; }
          echo "FICHIER=$FICHIER" >> "$GITHUB_ENV"
          echo "AGE_H=$AGE_H" >> "$GITHUB_ENV"

      - name: Déchiffrer et restaurer dans une base vide
        if: steps.config.outputs.actif == 'true'
        env:
          MDP: ${{ secrets.SAUVEGARDE_MOT_DE_PASSE }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Échec de la commande : $BASH_COMMAND (ligne $LINENO)"' ERR
          echo "Fichier : $FICHIER ($(stat -c %s "$FICHIER") octets)"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:MDP -in "$FICHIER" -out restauration.dump 2> openssl.txt; then
            echo "::error::Déchiffrement impossible ($(head -c 300 openssl.txt)) : le secret SAUVEGARDE_MOT_DE_PASSE ne correspond pas à celui utilisé pour cette sauvegarde, ou le fichier est abîmé."
            exit 1
          fi
          echo "Sauvegarde déchiffrée : $(stat -c %s restauration.dump) octets"
          DEBUT=$(date +%s)
          # Sans les rôles ni les droits de la base en ligne ; une extension propre à l'hébergeur peut manquer ici :
          # les erreurs sont listées, et le contrôle des tables (étape suivante) décide de la réussite.
          chmod a+r restauration.dump
          if ! docker run --rm --network host -v "$PWD:/d" -e PGPASSWORD=essai postgres:18-alpine \
            pg_restore -h 127.0.0.1 -p 5439 -U postgres -d restauration --no-owner --no-privileges /d/restauration.dump \
            2> erreurs_restauration.txt; then
            N=$(grep -c 'error' erreurs_restauration.txt || true)
            echo "::warning::pg_restore : $N erreur(s) ignorée(s) — $(grep -m 3 'error' erreurs_restauration.txt | tr '\n' ' ' | head -c 600)"
          fi
          echo "DUREE=$(( $(date +%s) - DEBUT ))" >> "$GITHUB_ENV"
          rm -f restauration.dump

      - name: Contrôler la base restaurée
        if: steps.config.outputs.actif == 'true'
        env:
          URL: ${{ secrets.BASE_EN_LIGNE_URL || secrets.RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Échec de la commande : $BASH_COMMAND (ligne $LINENO)"' ERR
          export COMPTE="SELECT table_name, (xpath('/row/n/text()', query_to_xml(format('SELECT COUNT(*) AS n FROM voicebank.%I', table_name), false, true, '')))[1]::text::bigint FROM information_schema.tables WHERE table_schema = 'voicebank' AND table_type = 'BASE TABLE' ORDER BY 1"
          docker run --rm --network host -e PGPASSWORD=essai -e COMPTE postgres:18-alpine \
            sh -c 'psql -h 127.0.0.1 -p 5439 -U postgres -d restauration -XAtF ";" -c "$COMPTE"' > restauree.txt
          docker run --rm -e URL -e COMPTE postgres:18-alpine sh -c 'psql "$URL" -XAtF ";" -c "$COMPTE"' > en_ligne.txt
          python3 - <<'PY'
          import os, sys
          lire = lambda f: {l.split(";")[0]: int(l.split(";")[1]) for l in open(f) if ";" in l}
          r, e = lire("restauree.txt"), lire("en_ligne.txt")
          erreurs = []
          if set(r) != set(e):
              erreurs.append(f"tables différentes : manquantes {sorted(set(e) - set(r))}, en trop {sorted(set(r) - set(e))}")
          for t in ("utilisateurs", "clients", "transactions", "sources_donnees", "journal_audit"):
              if t in e and e[t] > 0 and r.get(t, 0) == 0:
                  erreurs.append(f"table essentielle vide après restauration : {t}")
          # Les données bougent depuis la nuit : on tolère un écart, pas une table à moitié vide
          for t, n in e.items():
              if n >= 100 and r.get(t, 0) < n * 0.5:
                  erreurs.append(f"{t} : {r.get(t, 0)} lignes restaurées pour {n} en ligne")
          lignes = [f"| {t} | {r.get(t, 0)} | {n} |" for t, n in sorted(e.items())]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"## Test de restauration\n\nSauvegarde de {os.environ['AGE_H']} h, restaurée en "
                      f"{os.environ['DUREE']} s : {len(r)} tables, {sum(r.values())} lignes.\n\n"
                      "| Table | Restaurée | En ligne |\n|---|---|---|\n" + "\n".join(lignes) + "\n")
          print(f"{len(r)} tables, {sum(r.values())} lignes restaurées")
          if erreurs:
              print("\n".join("::error::" + x for x in erreurs)); sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"BILAN={len(r)} tables et {sum(r.values())} lignes restaurées en {os.environ['DUREE']} s, "
                      f"sauvegarde de {os.environ['AGE_H']} h.\n")
          PY

      - name: Prévenir (réussite)
        if: success() && steps.config.outputs.actif == 'true'
        uses: ./.github/actions/alerte-email
        with:
          sujet: "✅ Test de restauration réussi — VoiceBank"
          message: >-
            Le test mensuel de restauration a réussi : ${{ env.BILAN }} Vos sauvegardes sont utilisables.
          brevo_api_key: ${{ secrets.BREVO_API_KEY }}
          destinataire: ${{ secrets.ALERTE_EMAIL }}
          expediteur: ${{ secrets.EMAIL_EXPEDITEUR }}

      - name: Prévenir (échec)
        if: failure()
        uses: ./.github/actions/alerte-email
        with:
          sujet: "⚠ Test de restauration en échec — VoiceBank"
          message: >-
            Le test mensuel de restauration a échoué : une sauvegarde pourrait ne pas être utilisable le jour où
            vous en aurez besoin. Ouvrez le journal de l'exécution pour voir l'étape en cause (sauvegarde trop
            ancienne, mot de passe de chiffrement, restauration, contrôle des tables).
          brevo_api_key: ${{ secrets.BREVO_API_KEY }}
          destinataire: ${{ secrets.ALERTE_EMAIL }}
          expediteur: ${{ secrets.EMAIL_EXPEDITEUR }}
