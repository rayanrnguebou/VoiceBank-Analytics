# VOICEBANK ANALYTICS — Blueprint Render
# Les secrets (sync: false) se renseignent dans le tableau de bord Render.

services:
  - type: web
    name: voicebank-api
    runtime: docker
    dockerfilePath: ./voicebank_api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voicebank-db
          property: connectionString
      - key: READONLY_DATABASE_URL     # URL du compte voicebank_reader (voir README)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VOICEBANK_USERS
        sync: false
      - key: ALLOWED_ORIGINS           # ex. https://voicebank-ui.onrender.com
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: voicebank-ui
    runtime: static
    rootDir: voicebank-ui
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: REACT_APP_API_URL         # ex. https://voicebank-api.onrender.com
        sync: false
      - key: REACT_APP_POWER_BI_URL
        sync: false

databases:
  - name: voicebank-db
    databaseName: voicebank_db
    plan: free
