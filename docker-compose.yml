# VOICEBANK ANALYTICS — Docker Compose
# Auteur : Nguebou Temgoua Rayan
# 1. cp .env.example .env   puis remplis les valeurs
# 2. docker compose up -d --build
# 3. Interface : http://localhost:3000   API : http://localhost:8000/health
# pgAdmin (optionnel) : docker compose --profile admin up -d  -> http://localhost:5050

services:
  postgres:
    image: postgres:15-alpine   # même version que ta base existante (volume voicebank_postgres_data)
    container_name: voicebank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voicebank_db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-voicebank_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD manquant dans .env}
      VOICEBANK_APP_PASSWORD: ${VOICEBANK_APP_PASSWORD:?manquant}
      VOICEBANK_READER_PASSWORD: ${VOICEBANK_READER_PASSWORD:?manquant}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"        # accessible uniquement depuis ta machine (Talend, Power BI)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./voicebank_db/init:/docker-entrypoint-initdb.d:ro
      - ./voicebank_db/securite:/voicebank_securite:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d voicebank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: voicebank_api/Dockerfile
    container_name: voicebank_api
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://voicebank_app:${VOICEBANK_APP_PASSWORD}@postgres:5432/voicebank_db
      READONLY_DATABASE_URL: postgresql://voicebank_reader:${VOICEBANK_READER_PASSWORD}@postgres:5432/voicebank_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      VOICEBANK_USERS: ${VOICEBANK_USERS:?VOICEBANK_USERS manquant}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WHISPER_LOCAL: ${WHISPER_LOCAL:-auto}            # utilisé si GROQ_API_KEY est vide
      WHISPER_LOCAL_MODELE: ${WHISPER_LOCAL_MODELE:-base}
      # Offre publique : essai gratuit, abonnements, paiement
      ESSAI_JOURS: ${ESSAI_JOURS:-3}
      PRIX_JOUR: ${PRIX_JOUR:-500}
      PRIX_SEMAINE: ${PRIX_SEMAINE:-2000}
      PRIX_MOIS: ${PRIX_MOIS:-6000}
      PRIX_ANNEE: ${PRIX_ANNEE:-60000}
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY:-}
      NOTCHPAY_HASH_KEY: ${NOTCHPAY_HASH_KEY:-}
      URL_INTERFACE: ${URL_INTERFACE:-http://localhost:3000}
      PAIEMENT_SIMULATION: ${PAIEMENT_SIMULATION:-false}   # true : tester sans compte marchand (local)
    volumes:
      - whisper_modeles:/app/modeles_whisper
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./voicebank-ui
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: voicebank_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["admin"]
    container_name: voicebank_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@voicebank.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}   # obligatoire si tu lances le profil admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: voicebank_postgres_data
  whisper_modeles:
    name: voicebank_whisper_modeles
