# Tests automatiques à chaque push et pull request
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (pytest + PostgreSQL + MariaDB + Oracle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:            # base externe de test pour le connecteur
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      oracle:             # base externe de test pour le connecteur Oracle
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Oracle-Test-2026
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voicebank_api/requirements*.txt
      - name: Outils système (psql, ffmpeg pour les tests audio)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client ffmpeg
      - name: Dépendances
        run: pip install -r voicebank_api/requirements-dev.txt
      - name: Tests
        working-directory: voicebank_api
        env:
          TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_MYSQL_ROOT_URL: mysql://root:root@127.0.0.1:3306/
          TEST_ORACLE_URL: oracle://system:Oracle-Test-2026@127.0.0.1:1521/FREEPDB1
          PYTHONFAULTHANDLER: "1"
        # En cas d'échec, la fin du journal est remontée en annotation (visible sans télécharger les logs)
        run: |
          set +e
          pytest -q 2>&1 | tee sortie.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=pytest (code $code)::$(tail -n 60 sortie.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit $code

  interface:
    name: Interface (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicebank-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voicebank-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"

  bout-en-bout:
    name: Bout en bout (navigateur réel, 26 scénarios + attaques)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine   # la base « externe » du connecteur est vérifiée en version 16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            voicebank_api/requirements*.txt
            tests_e2e/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voicebank-ui/package-lock.json
      - name: Outils système
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Dépendances
        run: |
          pip install -r voicebank_api/requirements-dev.txt -r tests_e2e/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --no-audit --no-fund --prefix voicebank-ui
      - name: Scénarios
        run: python tests_e2e/lancer.py --pg postgresql://postgres:postgres@localhost:5432/postgres
      - name: Captures et journal de l'API (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bout-en-bout
          path: |
            tests_e2e/sortie/captures
            tests_e2e/sortie/api.log
          retention-days: 7
