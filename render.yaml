# VOICEBANK ANALYTICS — Blueprint Render
# Les secrets (sync: false) se renseignent dans le tableau de bord Render.
# Render → New → Blueprint → choisir ce dépôt. Voir README, section « Mettre en ligne ».

services:
  - type: web
    name: voicebank-api
    runtime: docker
    plan: free                         # sans cette ligne, Render propose une offre payante
    dockerfilePath: ./voicebank_api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voicebank-db
          property: connectionString
      - key: READONLY_DATABASE_URL     # URL du compte voicebank_reader (voir README)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VOICEBANK_USERS
        sync: false
      - key: ALLOWED_ORIGINS           # ex. https://voicebank-ui.onrender.com
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHISPER_LOCAL              # offre gratuite (512 Mo) : transcription via Groq uniquement
        value: "false"
      - key: URL_INTERFACE              # retour après paiement (adresse de l'interface)
        value: https://voicebank-ui.onrender.com
      - key: NOTCHPAY_PUBLIC_KEY        # paiement : business.notchpay.co → Settings → API Keys
        sync: false
      - key: NOTCHPAY_HASH_KEY          # signature des webhooks (même page)
        sync: false
      - key: INITIALISER_BASE           # crée le schéma au démarrage (idempotent)
        value: "true"
      - key: DONNEES_DEMO               # remplit une base VIDE avec des données fictives
        value: "true"

  - type: web
    name: voicebank-ui
    runtime: static                    # sites statiques : gratuits
    rootDir: voicebank-ui
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Si l'API change d'adresse (domaine personnalisé), mets-la aussi dans connect-src.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://voicebank-api.onrender.com; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    envVars:
      - key: REACT_APP_API_URL         # ex. https://voicebank-api.onrender.com
        sync: false
      - key: REACT_APP_POWER_BI_URL
        sync: false

databases:
  - name: voicebank-db                # offre gratuite : expire 30 jours après sa création (voir README)
    databaseName: voicebank_db
    plan: free
